name: Deploy

# Ships one commit to one environment, in dependency order: migrate the
# database, deploy the API and wait until it serves the new revision, then
# deploy the web app that calls it. Called by pipeline.yml.
#
# Autodeploy is off in Railway: this workflow is the only thing that deploys
# the API, always at the commit it migrated for.
#
# The GitHub environment (prod) provides:
#   secrets.DATABASE_URL   PlanetScale `migrations` role, which owns the schema
#   secrets.RAILWAY_TOKEN  Railway project token scoped to that environment
#   vars.API_URL           Public URL of the API, polled for the new revision
# And at repository level: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
#
# Actions are pinned to commit SHAs because these jobs hold production
# credentials: a moved tag would run unreviewed code with them.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy to.
        type: string
        required: true
      production:
        description: Ship the web app as Vercel's production deployment.
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate database
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @wappiz/db...

      # Fails if an applied migration changed since, which migrate would
      # silently skip.
      - name: Check migration history
        run: pnpm --filter @wappiz/db db:check-migrations

      # Never `drizzle-kit push`: it would drop the exclusion constraints in
      # scripts/schema-extras.sql, which Drizzle cannot model.
      - name: Migrate
        run: pnpm --filter @wappiz/db db:migrate

  api:
    name: Deploy API
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.API_URL }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API_URL: ${{ vars.API_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.70.0

      # Railway builds this commit from its GitHub source (.railway/railway.ts),
      # so the deployment carries its message and author. The script waits
      # until the API serves this revision: that is what guarantees the
      # web app never ships ahead of the API it calls.
      - name: Deploy
        run: scripts/railway-deploy.sh

  web:
    name: Deploy web
    needs: api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PROD_FLAG: ${{ inputs.production && '--prod' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@60.1.3

      # Vercel builds the uploaded source in its own build container, using
      # the project settings (root directory web/apps/web) and the env vars of
      # the target environment. Building here with `vercel build --prebuilt`
      # would not work: Vercel never hands out the values of Sensitive env
      # vars (BETTER_AUTH_SECRET and other secrets), so prerendering fails env
      # validation.
      - name: Deploy
        id: deploy
        run: |
          url="$(vercel deploy $VERCEL_PROD_FLAG --archive=tgz --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
