name: Pipeline

# Every change goes through here: CI first, then a deploy, so the database,
# the API and the web app always ship in that order.
#
# - Pull requests only run CI; there is no preview deployment. Fork PRs get no
#   secrets and must never reach a deploy (do not switch this to
#   pull_request_target).
# - Pushes to main deploy to production. Only the head of main can deploy:
#   re-running an earlier commit's pipeline fails at the API. To roll back,
#   use Rollback on a previous deployment in Railway (the web app in Vercel
#   has its own) or revert on main; migrations only move forward, though.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Queue instead of cancelling: cancelling a run mid-deploy could stop a
# migration halfway. While a run waits, a newer push replaces it.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go:
    name: Go
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # golangci-lint's only-new-issues reads the pull request diff.
      pull-requests: read

  web:
    name: Web
    uses: ./.github/workflows/web-ci.yml

  production:
    name: Production
    needs: [go, web]
    if: github.event_name == 'push'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      production: true
    secrets: inherit
