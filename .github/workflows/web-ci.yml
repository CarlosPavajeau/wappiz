name: Web CI

# Web checks. Called by pipeline.yml, which runs them on every pull request
# and push to main before deploying.
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  web-ci:
    name: Web CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Component specs run in a real Chromium through Vitest browser mode.
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      # @wappiz/env validates these at build time; the build only needs them
      # to be well-formed, so placeholders stand in for the real secrets. The
      # vercel preset matches production and creates the .vercel/output
      # directory the build script copies into.
      - name: Build
        env:
          NITRO_PRESET: vercel
          AUTH_GOOGLE_ID: ci
          AUTH_GOOGLE_SECRET: ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-chars
          BETTER_AUTH_URL: http://localhost:3001
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ci
          CORS_ORIGIN: http://localhost:3001
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          POLAR_ACCESS_TOKEN: ci
          POLAR_WEBHOOK_SECRET: ci
          RESEND_API_KEY: ci
          RESEND_SEGMENT_ID: ci
          VITE_API_URL: http://localhost:8080
          VITE_CLOUDFLARE_TURNSTILE_SITE_KEY: ci
        run: pnpm build
