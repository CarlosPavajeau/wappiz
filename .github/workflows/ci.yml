name: CI

on:
  push:
    paths-ignore:
      - 'web/**'
  pull_request:
    paths-ignore:
      - 'web/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-ci:
    name: Go CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Pull once up front so parallel test binaries hit the local cache
      # instead of racing each other to the registry.
      - name: Pre-pull test images
        run: |
          docker pull public.ecr.aws/docker/library/postgres:16-alpine
          docker pull public.ecr.aws/docker/library/redis:8.0

      - name: Test
        # Ryuk only reaps leaked containers; the runner is ephemeral, and
        # skipping it avoids one more Docker Hub pull.
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test ./...
